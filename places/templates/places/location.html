{% load static %}
<div class="place-card">
    <img src="{% static 'places/foto.jpg' %}" alt="Фото місця" class="place-img">

    <div class="place-content">
        <div class="place-header">
            <span class="place-type">{{ place.category|default:"Локація" }}</span>
            <span class="place-date">{{ place.created_at }}</span>
        </div>

        <h3 class="place-title">
            <a href="{% url 'place_detail' place.id %}">{{ place.title }}</a>
        </h3>

        <p class="place-location">
            {% if place.location %}
            📍 {{ place.location }}
            {% else %}
            📍 Secret place👀
            {% endif %}
        </p>

        <p class="place-description">
            {{ place.description|truncatewords:8|default:"Опис вершини..." }}
        </p>

        <div class="place-rating">
            ★ <span class="rating-num">({{ place.rating }}/5)</span>
        </div>
    </div>
</div>
