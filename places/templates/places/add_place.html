{% extends "places/base.html" %}

{% block title %}Додати нове місце — Places to Visit{% endblock %}

{% block content %}
<div class="page-header">
    <h2>⛰️ Додати нове місце</h2>
    <a href="{% url 'place_list' %}" class="nav-link">← Назад до списку</a>
</div>

<div class="card">
    <form action="{% url 'add_place' %}" method="post" class="place-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_title">Назва локації / вершини *</label>
            <input type="text" id="id_title" name="title" required placeholder="наприклад, Шпиці">
        </div>

        <div class="form-group">
            <label for="id_category">Тип місця</label>
            <input type="text" id="id_category" name="category" placeholder="наприклад, Гірська вершина">
        </div>

        <div class="form-group">
            <label for="id_location">Локація (залиште порожнім для Secret place👀)</label>
            <input type="text" id="id_location" name="location" placeholder="наприклад, Чорногірський хребет">
        </div>

        <div class="form-group">
            <label for="id_rating">Ваш рейтинг (від 1 до 5) *</label>
            <input type="number" id="id_rating" name="rating" min="1" max="5" value="5" required>
        </div>

        <div class="form-group">
            <label for="id_description">Опис та враження</label>
            <textarea id="id_description" name="description" rows="4"
                      placeholder="Короткий опис або ваші враження..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Зберегти місце</button>
    </form>
</div>
{% endblock %}
